<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri Ân Cô Giáo - Không Gian 3D</title>
    <!-- Thư viện Three.js, Tween.js và TrackballControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* Menu điều khiển phía dưới */
        #menu {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }

        .menu-button {
            background-color: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 182, 193, 0.7);
            color: #ffb6c1;
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 25px;
            margin: 0 6px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .menu-button:hover {
            background-color: rgba(255, 105, 180, 0.4);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
            transform: translateY(-2px);
        }

        /* Giao diện Hộp Thư / Lời Chúc */
        #letter-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            color: #333;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.5);
            width: 360px;
            z-index: 1000;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            border: 2px solid #ffb6c1;
        }

        #letter-modal.active {
            transform: translate(-50%, -50%) scale(1);
        }

        #letter-modal h2 {
            color: #d81b60;
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 15px;
        }

        #letter-modal p {
            font-size: 15px;
            line-height: 1.7;
            color: #444;
            text-align: justify;
            margin-bottom: 25px;
        }

        .close-btn {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background-color: #ad1457;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Các nút chuyển đổi bố cục 3D và mở thư -->
    <div id="menu">
        <button class="menu-button" id="btn-table">Lưới Ảnh</button>
        <button class="menu-button" id="btn-sphere">Quả Cầu</button>
        <button class="menu-button" id="btn-helix">Xoắn Ốc</button>
        <button class="menu-button" id="btn-grid">Không Gian</button>
        <button class="menu-button" id="btn-letter">💌 Mở Lời Chúc</button>
    </div>

    <!-- Nội dung bức thư tri ân cô giáo -->
    <div id="letter-modal">
        <h2>Gửi Cô Giáo Kính Yêu!</h2>
        <p>Nhân dịp đặc biệt này, em xin gửi đến
