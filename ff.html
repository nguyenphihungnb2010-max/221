<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri Ân Cô Giáo - 3D</title>
    <!-- Thư viện Three.js và các plugin cần thiết -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Menu điều khiển phía dưới */
        #menu {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 1000;
            pointer-events: auto;
        }

        .menu-button {
            background-color: rgba(30, 30, 40, 0.85);
            border: 1px solid rgba(255, 182, 193, 0.8);
            color: #ffb6c1;
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 25px;
            margin: 0 5px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }

        .menu-button:hover {
            background-color: rgba(255, 105, 180, 0.6);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
        }

            color: #333;
            padding: 35px;
